<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Assignment Tasks</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
        gap: 30px;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
        background-color: #5ab5ff; /* Initial Default Background */
        color: #111827;
      }

      .card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        padding: 24px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        text-align: center;
      }

      .card h2 {
        margin-bottom: 20px;
        font-size: 1.3rem;
      }

      /* --- Question 1: Theme Selector Styles --- */
      .radio-group {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }

      .radio-option {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        cursor: pointer;
      }

      .radio-option input[type="radio"] {
        width: 22px;
        height: 22px;
        cursor: pointer;
      }

      /* --- Question 2: Counter Styles --- */
      .counter-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .counter-btn {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        background-color: #2563eb;
        color: white;
        cursor: pointer;
        transition:
          background-color 0.2s,
          transform 0.1s;
      }

      .counter-btn:hover {
        background-color: #1d4ed8;
      }

      .counter-btn:active {
        transform: scale(0.95);
      }

      .counter-display {
        font-size: 2.2rem;
        font-weight: bold;
        min-width: 60px;
      }

      /* --- Question 3: Form Styles --- */
      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-field {
        width: 100%;
        padding: 12px 16px;
        font-size: 1rem;
        border: 2px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition:
          border-color 0.2s,
          background-color 0.2s;
      }
      .input-field:focus {
        outline: 2px solid goldenrod;
        outline-offset: -2px;
      }

      .input-field.error {
        background-color: pink;
        border-color: #ef4444;
        outline-color: #ef4444;
      }

      .submit-btn {
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        background-color: #16a34a;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .submit-btn:hover {
        background-color: #15803d;
      }

      .success-message {
        font-size: 1.5rem;
        font-weight: bold;
        color: #15803d;
        padding: 20px 0;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- QUESTION 1: Color Theme Toggler -->
    <div class="card">
      <h2>1. Select Theme Color</h2>
      <div class="radio-group" id="theme-group">
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#5ab5ff"
            style="accent-color: #5ab5ff"
            checked
          />
          blue
        </label>
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#03c4a1"
            style="accent-color: #03c4a1"
          />
          green
        </label>
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#c300ff"
            style="accent-color: #c300ff"
          />
          purple
        </label>
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#FFEB3B"
            style="accent-color: #ffeb3b"
          />
          sunny mode
        </label>
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#000000"
            style="accent-color: #000000"
          />
          night mode
        </label>
        <label class="radio-option">
          <input
            type="radio"
            name="theme"
            value="#ffffff"
            style="accent-color: #9ca3af"
          />
          white
        </label>
      </div>
    </div>

    <!-- QUESTION 2: Counter -->
    <div class="card">
      <h2>2. Counter (0 - 20)</h2>
      <div class="counter-controls">
        <button class="counter-btn" id="minus-btn">-</button>
        <span class="counter-display" id="counter-value">0</span>
        <button class="counter-btn" id="plus-btn">+</button>
      </div>
    </div>

    <!-- QUESTION 3: Login Form -->
    <div class="card">
      <h2>Login</h2>
      <form id="login-form" class="login-form" novalidate>
        <input
          type="text"
          id="fullname"
          class="input-field"
          placeholder="User full name"
          required
        />
        <input
          type="password"
          id="password"
          class="input-field"
          placeholder="Password"
          required
        />
        <button type="submit" class="submit-btn">Submit</button>
      </form>
      <div id="success-msg" class="success-message hidden">Form submitted</div>
    </div>

    <script>
      // ==========================================
      // QUESTION 1: Background Color Changer
      // ==========================================
      const themeGroup = document.getElementById("theme-group");

      themeGroup.addEventListener("change", (e) => {
        if (e.target.name === "theme") {
          const selectedColor = e.target.value;
          document.body.style.backgroundColor = selectedColor;

          document.body.style.color = "#111827";
        }
      });

      // ==========================================
      // QUESTION 2: Plus & Minus Counter
      // ==========================================
      let count = 0;
      const counterDisplay = document.getElementById("counter-value");
      const plusBtn = document.getElementById("plus-btn");
      const minusBtn = document.getElementById("minus-btn");

      plusBtn.addEventListener("click", () => {
        if (count < 20) {
          count++;
          counterDisplay.textContent = count;
        }
      });

      minusBtn.addEventListener("click", () => {
        if (count > 0) {
          count--;
          counterDisplay.textContent = count;
        }
      });

      // ==========================================
      // QUESTION 3: Login Form Validation
      // ==========================================
      const loginForm = document.getElementById("login-form");
      const fullNameInput = document.getElementById("fullname");
      const passwordInput = document.getElementById("password");
      const successMsg = document.getElementById("success-msg");

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        let isValid = true;

        // Validate Full Name
        if (fullNameInput.value.trim() === "") {
          fullNameInput.classList.add("error");
          isValid = false;
        } else {
          fullNameInput.classList.remove("error");
        }

        // Validate Password
        if (passwordInput.value.trim() === "") {
          passwordInput.classList.add("error");
          isValid = false;
        } else {
          passwordInput.classList.remove("error");
        }

        // If both inputs are fulfilled
        if (isValid) {
          loginForm.classList.add("hidden");
          successMsg.classList.remove("hidden");
        }
      });

      // Optional: Reset pink error background on typing
      [fullNameInput, passwordInput].forEach((input) => {
        input.addEventListener("input", () => {
          if (input.value.trim() !== "") {
            input.classList.remove("error");
          }
        });
      });
    </script>
  </body>
</html>
