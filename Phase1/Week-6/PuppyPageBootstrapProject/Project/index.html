<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/bootstrap.min.css" />
    <title>Puppy page</title>
  </head>
  <body>
    <header class="blue-bg container-fluid text-center text-light m-0">
      <h1 class="text-center m-0 py-2">Puppy lover's page</h1>
    </header>
    <section class="container-fluid mx-0 mt-0 my-5 p-0">
      <img
        src="./images/banner-puppies.jpg"
        alt="banner-puppy"
        class="img-fluid w-100"
      />
    </section>
    <section class="container justify-content-between">
      <div class="row g-4">
        <div class="d-block col-md-4">
          <div>
            <img class="w-100" src="./images/puppy-1.jpg" alt="" />
          </div>
        </div>
        <div class="d-none d-md-block col-md-4 bg-danger px-5 pt-5 missing">
          <p class="fw-bold text-center">Puppy missing here!!</p>
        </div>
        <div class="d-block col-md-4">
          <div><img class="w-100" src="./images/puppy-2.jpg" alt="" /></div>
        </div>
      </div>
    </section>
    <section class="text-center fw-bold">
      <p class="my-5 fs-3">More puppies</p>
    </section>
    <section class="container justify-content-between mb-5">
      <div class="row g-4">
        <div class="d-block col-md-6">
          <img class="w-100" src="./images/puppy-3.jpg" alt="" />
        </div>
        <div class="d-block col-md-6">
          <img class="w-100" src="./images/puppy-4.jpg" alt="" />
        </div>
      </div>
    </section>
    <footer class="container-fluid blue-bg">
      <div class="text-center text-light py-5 fw-bold fs-3">
        Developed By: Hanna.B
      </div>
    </footer>
  </body>
</html>
