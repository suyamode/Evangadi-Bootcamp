<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Puppy Lover's Page</title>
    <!-- Linke to google fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Caudex:ital,wght@0,400;0,700;1,400;1,700&family=Montenegrin+Gothic+One&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Noto+Sans+Ethiopic:wght@100..900&family=Playwrite+AU+TAS:wght@100..400&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira:ital,wght@0,100..900;1,100..900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/mystyle.css" />
  </head>
  <body>
    <!-- Header Part -->
    <header class="blue-bg">
      <h1>Puppy lovers page</h1>
    </header>
    <!-- Banner Puppy -->
    <section class="banner-image">
      <img src="./images/banner-puppies.jpg" />
    </section>
    <!-- Three Puppies Section -->
    <section class="three-puppies">
      <div class="puppy puppy-1"><img src="./images/puppy-1.jpg" /></div>
      <div class="puppy missing"><p>Puppy missing here!!</p></div>
      <div class="puppy puppy-2"><img src="./images/puppy-2.jpg" /></div>
    </section>
    <h3>More Puppies</h3>
    <!-- Two Puppies Section -->
    <section class="vertical-puppies">
      <div class="puppy puppy-3"><img src="./images/puppy-3.jpg" /></div>
      <div class="puppy puppy-4"><img src="./images/puppy-4.jpg" /></div>
    </section>
    <!-- Footer Section -->
    <footer class="blue-bg credits">
      <p>Developed By: Hana.B</p>
    </footer>
  </body>
</html>
